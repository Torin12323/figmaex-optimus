const q=s=>document.querySelector(s),bar=q('.ExBar'),show=()=>bar.classList.add('expanded');
q('#open').onclick=show;q('#close').onclick=()=>bar.classList.remove('expanded');q('.header').onmouseenter=show;q('.logo-but').onfocus=show;
q('#switch').onclick=e=>{const next=q('#skin').getAttribute('href')==='optimus.css'?'optimus-static.css':'optimus.css';q('#skin').href=next;e.target.textContent=next==='optimus.css'?'切换到静态版':'切换到动态版'};
q('.setting-but').onclick=()=>q('#status').textContent='设置按钮可点击。实际安装请进入 FigmaEX 设置 → 皮肤。';
for(const item of document.querySelectorAll('.group:not(.new-group),.ActionItem'))item.onclick=()=>{for(const e of item.parentElement.children)e.classList.remove('active');item.classList.add('active')};
q('.new-group').onclick=()=>{const g=document.createElement('div');g.className='group';g.tabIndex=0;g.innerHTML='<span class="name">新目录</span><span class="len">0</span>';q('.new-group').before(g);q('#status').textContent='试用目录已添加。'};
document.addEventListener('keydown',e=>{if(e.key==='Escape')bar.classList.remove('expanded');if((e.key==='Enter'||e.key===' ')&&e.target.matches('[role=button],.group,.ActionItem')){e.preventDefault();e.target.click()}});
for (const row of document.querySelectorAll('.ActionItem')) {
  const note = row.querySelector('.note-name');
  const title = row.querySelector('.name').textContent;
  const actions = row.querySelector('.buttons');
  actions.onclick = event => {
    event.stopPropagation();
    const button = event.target;
    if (button.matches('.star-but')) {
      const selected = button.classList.toggle('isStar');
      button.setAttribute('aria-pressed', String(selected));
      q('#status').textContent = row.querySelector('.name').textContent + (selected ? ' 已收藏' : ' 已取消收藏');
    } else if (button.matches('.info-but')) {
      q('#status').textContent = row.querySelector('.name').textContent + ' · ' + note.textContent;
    } else if (button.matches('.note-but')) {
      const previous = note.textContent;
      const editor = document.createElement('input');
      editor.className = 'note-name-edit';
      editor.setAttribute('aria-label', '插件备注');
      editor.value = previous;
      note.replaceChildren(editor);
      editor.onblur = () => {
        const line = document.createElement('div');
        line.textContent = editor.value;
        note.replaceChildren(line);
      };
      editor.onkeydown = event => {
        event.stopPropagation();
        if (event.key === 'Escape') editor.value = previous;
        if (event.key === 'Enter' || event.key === 'Escape') editor.blur();
      };
      editor.focus();
      editor.select();
    }
  };
  for (const button of actions.children) {
    button.setAttribute('role','button');
    button.setAttribute('aria-label',button.title);
    button.tabIndex = 0;
  }
}

const demoToggle = q('#three-demo');
const demoRows = [...bar.querySelectorAll('.mSortlist .ActionItem')];
const glassPlugins = [
  ['Liquid Glass Distortion','液态玻璃扭曲'],
  ['Glassmorphism','玻璃质感'],
  ['Liquid Glass','液态玻璃']
];
const initialLabels = demoRows.slice(0,3).map(row=>[row.querySelector('.name > div').textContent,row.querySelector('.note-name > div').textContent]);
demoToggle.onclick = () => {
  const enabled = demoToggle.getAttribute('aria-pressed') !== 'true';
  demoToggle.setAttribute('aria-pressed', String(enabled));
  demoToggle.textContent = enabled ? '显示全部插件' : '查看三个插件时的剑身';
  for (const [i,row] of demoRows.entries()) {
    row.style.display = enabled && i >= 3 ? 'none' : '';
    if (i >= 3) continue;
    const [name,note] = (enabled ? glassPlugins : initialLabels)[i];
    row.querySelector('.name > div').textContent = name;
    row.querySelector('.note-name > div').textContent = note;
  }
  bar.style.height = enabled ? '560px' : '';
  if (enabled) show();
};

</script></head></html>
