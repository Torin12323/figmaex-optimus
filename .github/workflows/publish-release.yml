name: Publish Optimus v1.6.3
on:
  push:
    branches: [main]
    paths: [.github/workflows/publish-release.yml]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: release-optimus-v1.6.3
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify package and publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: Torin12323/figmaex-optimus
          RELEASE_COMMIT: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --output figmaex-optimus-v1.6.3.zip "https://raw.githubusercontent.com/Torin12323/figmaex-optimus/$RELEASE_COMMIT/figmaex-optimus-v1.6.3.zip"
          echo "915f027804d37bdc2c53d72e521bf1c6d7ac68a1b587dffe926893a6442a36cf  figmaex-optimus-v1.6.3.zip" | sha256sum --check
          cat > release-notes.md <<'NOTES'
          ## 星辰剑工具栏 v1.6.3
          - 插件较少时，金属剑脊延伸至剑尖。
          - 插件列表向左加宽，名称和图标放大；悬停操作位于第二行。
          - 离线预览可切换到三个插件的布局。

          下载 Assets 的 figmaex-optimus-v1.6.3.zip。解压后先打开 preview.html，确认效果，再把 optimus.css（动态）或 optimus-static.css（静态）全文替换到 FigmaEX 的自定义 CSS 中。
          
          本地按 FigmaEX v1.5.101 的样式和组件结构测试；实际扩展中的保存、运行插件和拖动仍需试装确认。
          NOTES
          if gh release view v1.6.3 --repo "$GH_REPO" >/dev/null 2>&1; then
            echo "Release already exists; keeping it unchanged."
            exit 0
          fi
          gh release create v1.6.3 figmaex-optimus-v1.6.3.zip --repo "$GH_REPO" --target "$RELEASE_COMMIT" --title "擎天柱皮肤 v1.6.3 · 星辰剑" --notes-file release-notes.md --latest

