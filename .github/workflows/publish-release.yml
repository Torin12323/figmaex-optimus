name: Publish Optimus v1.4.3
on:
  push:
    branches: [main]
    paths: [.github/workflows/publish-release.yml]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: release-optimus-v1.4.3
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify package and publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: Torin12323/figmaex-optimus
          RELEASE_COMMIT: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --output figmaex-optimus-v1.4.3.zip "https://raw.githubusercontent.com/Torin12323/figmaex-optimus/$RELEASE_COMMIT/figmaex-optimus-v1.4.3.zip"
          echo "0080e887c41c7228eaec7fc26e8d9b8d8add9ca4c7681c8cc9a38f5c3680c8c6  figmaex-optimus-v1.4.3.zip" | sha256sum --check
          cat > release-notes.md <<'NOTES'
          ## 背景自动铺满
          - 装甲背景随面板和两侧区域尺寸铺满，取消固定像素高度。
          - 处理 SVG 内部比例留白和空白容器遮挡，文字控件继续使用实色底。
          - 布局、定位、滚动和流光速度保持不变。
          - 包含开发验收规范及无需粘贴代码的临时恢复步骤。
          
          下载下方 Assets 中的 figmaex-optimus-v1.4.3.zip，复制 optimus.css 全文替换旧 CSS。静态版使用 optimus-static.css。
          
          验证：本地 Chromium 的发布包结构模拟，检查不同高度、深浅主题及改动前后几何；未直接操作用户实际安装。外壳自动高度仍暂缓。
          NOTES
          if gh release view v1.4.3 --repo "$GH_REPO" >/dev/null 2>&1; then
            echo "Release already exists; keeping it unchanged."
            exit 0
          fi
          gh release create v1.4.3 figmaex-optimus-v1.4.3.zip --repo "$GH_REPO" --target "$RELEASE_COMMIT" --title "擎天柱皮肤 v1.4.3 · 背景自动铺满" --notes-file release-notes.md --latest
